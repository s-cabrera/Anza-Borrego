<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Layout plan and checklist for the Anza Borrego stargazing trip, December 4 to 6, 2026.">
<title>Anza Borrego Stargazing Trip</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d2461">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Layout idea: a night-sky banner over a white page, then one bordered card per category with checkable rows. */
  :root {
    --paper: #ffffff;
    --ink: #1b2a41;
    --muted: #66748b;
    --line: #e3e8f1;
    --soft: #f5f8fd;
    --sky-1: #0d2461;
    --sky-2: #2a64c8;
    --sky-3: #7dbcf4;
    --matt: #2a63c4;
    --steph: #c43d86;
    --both: #7a52c7;
    --byo: #2e8b57;
    --font-display: "Bree Serif", Georgia, "Times New Roman", serif;
    --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; background: #fff; }
  body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
  .page { max-width: 1000px; margin: 0 auto; padding: 16px 16px 72px; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; border-radius: 26px; color: #fff;
    background: linear-gradient(180deg, var(--sky-1) 0%, #1a47a3 36%, var(--sky-2) 62%, var(--sky-3) 100%);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .starfield { position: absolute; inset: 0; pointer-events: none; }
  .star { position: absolute; border-radius: 50%; background: #fff; }
  .star.tw { animation: twinkle 3.6s ease-in-out infinite; }
  .spark { position: absolute; fill: #fff6cf; transform: translate(-50%, -50%); filter: drop-shadow(0 0 6px rgba(255, 246, 207, .7)); }
  .spark.tw { animation: twinkle 4.2s ease-in-out infinite; }
  .moon { position: absolute; right: 6%; top: 6%; width: 46px; height: 46px; border-radius: 50%; box-shadow: inset 13px -7px 0 0 #fff3c4; filter: drop-shadow(0 0 10px rgba(255, 243, 196, .55)); }
  @keyframes twinkle { 0%, 100% { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1); opacity: 1; } 50% { transform: translate(var(--tx, 0), var(--ty, 0)) scale(.55); opacity: .45; } }
  .star.tw { --tx: 0; --ty: 0; }
  .spark.tw { --tx: -50%; --ty: -50%; }
  .hero-text { position: relative; z-index: 2; text-align: center; padding: 46px 20px 10px; }
  .eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #cfe3ff; }
  .hero h1 { margin: 0; font: 400 clamp(34px, 7.4vw, 68px)/1.04 var(--font-display); text-wrap: balance; text-shadow: 0 2px 18px rgba(5, 15, 50, .55); }
  .dates { margin: 12px 0 0; font-size: 16px; font-weight: 700; color: #e6f1ff; }
  .scene { position: relative; z-index: 1; display: block; width: 100%; height: auto; margin-top: 6px; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; }
  .flame.f2 { animation-duration: 1.15s; animation-delay: -.4s; }
  @keyframes flicker { 0%, 100% { transform: scale(1, 1); } 40% { transform: scale(.94, 1.07); } 70% { transform: scale(1.04, .95); } }

  /* ---------- Toolbar ---------- */
  .toolbar { position: sticky; top: 0; z-index: 30; margin: 14px -16px 22px; padding: 10px 16px; background: rgba(255, 255, 255, .95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .progress-row { display: flex; align-items: center; gap: 12px; }
  .progress-label { font-size: 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 10px; border-radius: 99px; background: #e9eef7; overflow: hidden; min-width: 60px; }
  .bar > span { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #2a64c8, #f08a24); transition: width .25s ease; }
  .reset { font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  .reset:hover { border-color: #b9c4d8; color: var(--ink); }
  .reset.armed { background: #fff1ee; border-color: #f0b3a6; color: #b23a22; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .chips a { flex: none; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); font-size: 14px; font-weight: 700; padding: 6px 12px 6px 8px; border-radius: 99px; border: 1px solid var(--line); background: #fff; }
  .chips a:hover { background: var(--soft); }
  .chips .ic { width: 18px; height: 18px; color: var(--c); }

  /* ---------- Cards ---------- */
  main { display: grid; gap: 22px; }
  .card { --cs: color-mix(in srgb, var(--c) 13%, #fff); background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 20px; padding: 22px; box-shadow: 0 10px 28px -20px rgba(20, 40, 80, .35); scroll-margin-top: 130px; }
  .card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .badge { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--cs); color: var(--c); }
  .badge .ic { width: 30px; height: 30px; }
  .card h2 { margin: 0; font: 400 clamp(23px, 4.4vw, 30px)/1.15 var(--font-display); text-wrap: balance; }
  .card-note { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Meal plan ---------- */
  .dayhead { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; flex-wrap: wrap; }
  .dayhead:first-of-type { margin-top: 6px; }
  .daynum { width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font: 400 18px/1 var(--font-display); }
  .dayhead h3 { margin: 0; font: 400 21px/1.2 var(--font-display); }
  .date { color: var(--muted); font-weight: 700; font-size: 14px; }
  .meals { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .meal { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px 8px; }
  .meal h4 { margin: 0 6px 6px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
  .meal h4 span { text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 15px; font-weight: 800; }
  .subhead { display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; }
  .subhead .ic { width: 26px; height: 26px; color: var(--c); }
  .subhead h3 { margin: 0; font: 400 21px/1.2 var(--font-display); }

  /* ---------- Lists and checkbox rows ---------- */
  .list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); column-gap: 22px; row-gap: 1px; }
  .list.one { grid-template-columns: 1fr; }
  .list.nested { margin: 0 0 4px 34px; grid-template-columns: 1fr; }
  .item { position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 7px 8px; border-radius: 10px; cursor: pointer; }
  .item:hover { background: color-mix(in srgb, var(--c) 7%, #fff); }
  .item input { position: absolute; left: 8px; top: 7px; width: 22px; height: 22px; margin: 0; opacity: 0; cursor: pointer; }
  .box { flex: none; width: 22px; height: 22px; margin-top: 1px; border: 2px solid #b5c0d3; border-radius: 7px; background: #fff; display: grid; place-items: center; transition: background .12s, border-color .12s; }
  .box::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translate(0, -1px) rotate(45deg); opacity: 0; }
  .item input:checked + .box { background: var(--c); border-color: var(--c); }
  .item input:checked + .box::after { opacity: 1; }
  .item input:focus-visible + .box { outline: 3px solid color-mix(in srgb, var(--c) 45%, #fff); outline-offset: 2px; }
  .txt { flex: 1; min-width: 0; line-height: 1.35; padding-top: 2px; }
  .nm { font-weight: 700; }
  .q { color: var(--muted); font-weight: 600; }
  .why { display: block; margin-top: 1px; font-size: 13px; color: var(--muted); font-weight: 400; }
  .need { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #a5481c; background: #ffeede; padding: 1px 7px; border-radius: 99px; margin-right: 4px; text-decoration: none; }
  .unk { display: inline-block; font-size: 11px; font-weight: 800; color: #8a5a00; background: #fff3cf; padding: 1px 7px; border-radius: 99px; text-decoration: none; }
  .tag { flex: none; align-self: flex-start; margin-top: 3px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: #eef2f8; color: #4a5a74; }
  .t-gs { background: #e3f5e9; color: #1f7a3f; }
  .t-tg { background: #fde6e4; color: #b3261e; }
  .t-home { background: #e8eefc; color: #2f4fa8; }
  .t-ma { background: #e1ecff; color: var(--matt); }
  .t-opt { background: #f1eaff; color: var(--both); }
  /* checked: strike the text and fade the tags */
  .item input:checked ~ .txt { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--c); }
  .item input:checked ~ .txt, .item input:checked ~ .txt * { color: #9aa5b8; }
  .item input:checked ~ .tag { opacity: .45; }

  /* ---------- Grocery ---------- */
  .store { margin-top: 18px; }
  .store:first-of-type { margin-top: 4px; }
  .store-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; padding-bottom: 8px; border-bottom: 2px dashed color-mix(in srgb, var(--c) 28%, #fff); }
  .store-head .ic { width: 26px; height: 26px; color: var(--c); }
  .store-head h3 { margin: 0; font: 400 21px/1.2 var(--font-display); }
  .count { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--muted); }
  .store-note { margin: 0 0 6px; color: var(--muted); font-size: 14px; }

  /* ---------- Supplies ---------- */
  .band { margin-top: 10px; padding: 4px 2px 0; }
  .band h2 { margin: 0; font: 400 clamp(26px, 5vw, 34px)/1.15 var(--font-display); }
  .band p { margin: 4px 0 12px; color: var(--muted); }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .legend div { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; font-size: 14px; }
  .pill { flex: none; display: inline-block; padding: 3px 12px; border-radius: 99px; font-size: 13px; font-weight: 800; color: #fff; background: var(--oc); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .o-matt { --oc: var(--matt); } .o-steph { --oc: var(--steph); } .o-both { --oc: var(--both); } .o-byo { --oc: var(--byo); }
  .ogroup { margin-top: 18px; padding-left: 14px; border-left: 4px solid color-mix(in srgb, var(--oc) 38%, #fff); break-inside: avoid; }
  .owner { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .owner h3 { margin: 0; font-size: 16px; font-weight: 800; }

  .ai-group { margin-top: 20px; }
  .ai-group:first-of-type { margin-top: 4px; }
  .ai-group h3 { margin: 0; font: 400 20px/1.25 var(--font-display); }
  .ai-group .card-note { margin-bottom: 6px; }
  footer { margin-top: 30px; text-align: center; color: var(--muted); font-size: 14px; }

  @media (max-width: 520px) {
    .card { padding: 16px 14px; border-radius: 18px; }
    .badge { width: 46px; height: 46px; }
    .toolbar .progress-label { font-size: 13px; }
    .tag { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star.tw, .spark.tw, .flame { animation: none; }
    .bar > span, .box { transition: none; }
  }
  @media print {
    .toolbar { display: none; }
    .card { box-shadow: none; break-inside: auto; }
    .meal, .ogroup, .store { break-inside: avoid; }
    .star.tw, .spark.tw, .flame { animation: none; }
    .tag { display: inline-block; }
  }
</style>
</head>

<script>
(function () {
